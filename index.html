<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>
<body>
    <!-- Grade de fundo estilo matrix -->
    <div class="grade-fundo"></div>

    <!-- Decorações de IA flutuantes -->
    <div class="decoracao decoracao-1">🤖</div>
    <div class="decoracao decoracao-2">🧠</div>
    <div class="decoracao decoracao-3">⚡</div>
    <div class="decoracao decoracao-4">💾</div>
    <div class="decoracao decoracao-5">🔮</div>
    <div class="decoracao decoracao-6">✨</div>
    <div class="decoracao decoracao-7">🌐</div>
    <div class="decoracao decoracao-8">🔷</div>

    <!-- Partículas de luz -->
    <div class="particula particula-1"></div>
    <div class="particula particula-2"></div>
    <div class="particula particula-3"></div>
    <div class="particula particula-4"></div>
    <div class="particula particula-5"></div>

    <div class="caixa-principal">
        <div class="badge-topo">⚡ SISTEMA ONLINE</div>
        <h1>Você decide o futuro da IA</h1>
        <div class="barra-progresso">
            <div class="barra-preenchida" id="barraProgresso"></div>
        </div>
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
        </div>
        <div class="rodape">🤖 Powered by Inteligência Artificial</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
